[project]
name = "composio-app-research"
version = "0.1.0"
description = "Agent-driven research pipeline for the Composio 100-app take-home"
requires-python = ">=3.11"
dependencies = [
    "composio-core",
    "composio-claude-agent-sdk",
    "claude-agent-sdk",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research*"]
